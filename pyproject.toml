[project]
name = "apitrace-mcp"
version = "0.2.1"
description = "MCP server for apitrace, aimed at reverse-engineering older games (DirectDraw/D3D7/D3D8/D3D9 and legacy OpenGL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
images = [
    "Pillow>=10,<13",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
apitrace-mcp = "apitrace_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apitrace_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
